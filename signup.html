<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MEMBERSHIP | LUXE SKIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Noto Sans KR', sans-serif; background: #f8f8f8; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background: #fff; border-bottom: 1px solid #eee; }
        .logo { font-size: 24px; font-weight: bold; letter-spacing: 2px; }
        .signup-container { max-width: 400px; margin: 80px auto; background: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h2 { text-align: center; margin-bottom: 30px; font-weight: 300; letter-spacing: 1px; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 15px; background: #1a1a1a; color: #fff; border: none; font-weight: bold; cursor: pointer; letter-spacing: 1px; }
        .btn-submit:hover { background: #333; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">LUXE SKIN</div>
        <div style="font-size: 14px;"><a href="index.html" style="text-decoration:none; color:#333;">BACK TO HOME</a></div>
    </nav>

    <div class="signup-container">
        <h2>JOIN US</h2>
        <form id="luxe-signup-form" onsubmit="alert('LUXE SKIN의 멤버가 되신 것을 환영합니다!'); return false;">
            <input type="text" placeholder="NAME" required>
            <input type="email" placeholder="EMAIL ADDRESS" required>
            <button type="submit" class="btn-submit">CREATE ACCOUNT</button>
        </form>
    </div>
</body>
</html>
